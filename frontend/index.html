<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대전 날씨 AI 비서</title>
  <meta name="description" content="대전 일별 기온 데이터를 이해하고 답하는 AI 비서">
  <script>
    // 첫 화면 깜빡임 방지: 저장된 테마 또는 OS 설정을 CSS 로드 전에 적용
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- config.js: Vercel 빌드 시 환경변수 API_BASE_URL 로 생성 (로컬에선 없어도 됨) -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
  <script src="api.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">°C</span>
      <div>
        <h1>대전 날씨 AI 비서</h1>
        <p class="brand-sub">기상청 ASOS 대전 관측 데이터 기반</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="server-status" class="status status-pending" role="status">
        <span class="dot" aria-hidden="true"></span><span class="status-text">연결 확인 중</span>
      </span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
      </button>
    </div>
  </header>

  <div id="wake-banner" class="banner" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span id="wake-text">무료 서버가 잠들어 있어 깨우는 중입니다. 첫 연결은 최대 1분 정도 걸릴 수 있어요.</span>
    <button id="wake-retry" class="btn btn-small" type="button" hidden>다시 시도</button>
  </div>

  <nav class="tabs" role="tablist" aria-label="화면 전환">
    <button class="tab is-active" role="tab" aria-selected="true" aria-controls="tab-chat" data-tab="chat" type="button">채팅</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="tab-data" data-tab="data" type="button">데이터 관리</button>
  </nav>

  <!-- ===== 채팅 탭 ===== -->
  <section id="tab-chat" class="tab-panel chat-layout" role="tabpanel">
    <aside class="panel conversations" aria-label="대화 기록">
      <div class="panel-head">
        <h2>대화 기록</h2>
        <button id="new-chat" class="btn btn-small btn-primary" type="button">+ 새 대화</button>
      </div>
      <ul id="conv-list" class="conv-list"></ul>
      <p id="conv-empty" class="muted small" hidden>저장된 대화가 없습니다.</p>
    </aside>

    <main class="panel chat" aria-label="AI 채팅">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <label for="chat-input" class="sr-only">질문 입력</label>
        <textarea id="chat-input" rows="1" maxlength="1000" placeholder="대전 날씨 기록에 대해 물어보세요" title="Enter 전송, Shift+Enter 줄바꿈"></textarea>
        <button id="chat-send" class="btn btn-primary" type="submit">전송</button>
      </form>
    </main>

    <aside class="panel insights" aria-label="데이터 요약">
      <div class="panel-head">
        <h2>데이터 요약</h2>
        <button id="refresh-insights" class="btn btn-small btn-ghost" type="button">새로고침</button>
      </div>
      <div id="summary" class="summary"><p class="muted small">불러오는 중…</p></div>

      <h3 class="section-title">월별 기온 추이</h3>
      <div class="chart-wrap"><canvas id="trend-chart" aria-label="월별 평균·평균최고·평균최저 기온 선 그래프" role="img"></canvas></div>
      <details class="chart-table">
        <summary>표로 보기</summary>
        <div class="table-scroll"><table id="monthly-table" class="table"></table></div>
      </details>

      <h3 class="section-title">추가 지표</h3>
      <div id="stats" class="stat-grid"></div>
    </aside>
  </section>

  <!-- ===== 데이터 관리 탭 ===== -->
  <section id="tab-data" class="tab-panel data-layout" role="tabpanel" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2 id="form-title">새 데이터 추가</h2>
      </div>
      <form id="data-form" class="data-form" novalidate>
        <label><span>날짜 <span class="req">*</span></span>
          <input type="date" name="date" required>
        </label>
        <label><span>평균기온 (°C) <span class="req">*</span></span>
          <input type="number" name="value" step="0.1" min="-50" max="50" required>
        </label>
        <label><span>최저기온 (°C)</span>
          <input type="number" name="min" step="0.1" min="-50" max="50">
        </label>
        <label><span>최고기온 (°C)</span>
          <input type="number" name="max" step="0.1" min="-50" max="50">
        </label>
        <label><span>일강수량 (mm)</span>
          <input type="number" name="rain" step="0.1" min="0" max="1000">
        </label>
        <label class="span-2"><span>메모</span>
          <input type="text" name="memo" maxlength="200" placeholder="예: 산책하기 좋은 날">
        </label>
        <p id="form-error" class="form-error span-2" role="alert" hidden></p>
        <div class="form-actions span-2">
          <button id="form-submit" class="btn btn-primary" type="submit">추가</button>
          <button id="form-cancel" class="btn btn-ghost" type="button" hidden>수정 취소</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>데이터 목록</h2>
        <div class="toolbar">
          <label class="inline">표시
            <select id="data-limit">
              <option value="30">최근 30일</option>
              <option value="90">최근 90일</option>
              <option value="">전체</option>
            </select>
          </label>
          <button id="export-csv" class="btn btn-small" type="button">CSV 내보내기</button>
          <button id="export-json" class="btn btn-small" type="button">JSON 내보내기</button>
        </div>
      </div>
      <div class="table-scroll">
        <table class="table data-table">
          <thead>
            <tr><th>날짜</th><th>평균</th><th>최저</th><th>최고</th><th>강수(mm)</th><th>메모</th><th><span class="sr-only">작업</span></th></tr>
          </thead>
          <tbody id="data-tbody"><tr><td colspan="7" class="muted">불러오는 중…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
